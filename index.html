<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Evaluation — CEEMP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#16233F;
  --blueprint:#2E5EAA;
  --blueprint-light:#EDF2FB;
  --paper:#FAF8F3;
  --card:#FFFFFF;
  --line:#DCD5C6;
  --slate:#5B6472;
  --success:#2F7D5D;
  --success-bg:#E7F3ED;
  --amber:#B9760C;
  --amber-bg:#FBF1E1;
  --danger:#B4423A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:28px 28px;
  background-attachment:fixed;
  font-family:'IBM Plex Sans', sans-serif;
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono', monospace;}
.wrap{
  max-width:720px;
  margin:0 auto;
  padding:28px 18px 80px;
}
header.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;
  margin-bottom:26px;
}
.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.brand .eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--blueprint);
  font-weight:600;
}
.brand h1{
  font-size:20px;
  margin:0;
  font-weight:700;
  letter-spacing:-0.01em;
}
.mode-switch{
  display:flex;
  gap:0;
  border:1.5px solid var(--ink);
  border-radius:6px;
  overflow:hidden;
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
}
.mode-switch button{
  border:none;
  background:var(--card);
  color:var(--ink);
  padding:7px 12px;
  cursor:pointer;
  font-family:inherit;
  font-size:inherit;
  letter-spacing:.03em;
}
.mode-switch button.active{
  background:var(--ink);
  color:#fff;
}
.mode-switch button:not(:last-child){border-right:1.5px solid var(--ink);}

.stepper{
  display:flex;
  gap:6px;
  margin-bottom:22px;
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--slate);
}
.stepper .step{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--card);
}
.stepper .step.current{
  border-color:var(--blueprint);
  color:var(--blueprint);
  font-weight:600;
  background:var(--blueprint-light);
}
.stepper .step.done{
  color:var(--success);
  border-color:var(--success);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:26px 24px;
  box-shadow:0 1px 2px rgba(22,35,63,.04);
  margin-bottom:18px;
}
.card h2{
  margin:0 0 6px;
  font-size:17px;
  font-weight:700;
}
.card .sub{
  color:var(--slate);
  font-size:13.5px;
  margin:0 0 18px;
  line-height:1.5;
}
label.field-label{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--slate);
  margin-bottom:6px;
}
input[type=text], input[type=password], textarea, select{
  width:100%;
  font-family:'IBM Plex Sans', sans-serif;
  font-size:15px;
  padding:11px 12px;
  border:1.5px solid var(--line);
  border-radius:6px;
  background:#fff;
  color:var(--ink);
}
input[type=text]:focus, input[type=password]:focus, textarea:focus, select:focus{
  outline:2px solid var(--blueprint);
  outline-offset:1px;
  border-color:var(--blueprint);
}
textarea{resize:vertical; min-height:70px; line-height:1.5;}
.btn{
  font-family:'IBM Plex Sans', sans-serif;
  font-weight:600;
  font-size:14.5px;
  padding:11px 20px;
  border-radius:6px;
  border:1.5px solid var(--ink);
  background:var(--ink);
  color:#fff;
  cursor:pointer;
}
.btn:hover{background:#233254;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn.secondary{
  background:transparent;
  color:var(--ink);
}
.btn.secondary:hover{background:var(--blueprint-light);}
.btn.small{padding:7px 12px; font-size:13px;}
.btn.danger{border-color:var(--danger); color:var(--danger); background:transparent;}
.btn.danger:hover{background:#FBEBEA;}
.error-msg{
  color:var(--danger);
  font-size:13.5px;
  margin-top:10px;
  font-weight:500;
}

.roster-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.roster-list li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1.5px solid var(--line);
  border-radius:8px;
  padding:13px 15px;
}
.roster-list .who{display:flex; flex-direction:column; gap:2px;}
.roster-list .who .id{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--slate);}
.roster-list .who .name{font-weight:600; font-size:15px;}
.status-chip{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  letter-spacing:.05em;
  text-transform:uppercase;
  padding:4px 9px;
  border-radius:20px;
  font-weight:600;
}
.status-chip.pending{background:var(--amber-bg); color:var(--amber);}
.status-chip.done{background:var(--success-bg); color:var(--success);}

/* Grid / title-block rating table */
.grid-block{
  border:1.5px solid var(--ink);
  border-radius:8px;
  overflow:hidden;
  margin-bottom:8px;
}
.grid-title{
  background:var(--ink);
  color:#fff;
  padding:10px 14px;
  font-weight:700;
  font-size:14px;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}
.grid-title .idx{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  color:#AFC0E0;
  letter-spacing:.08em;
}
.grid-explanation{
  background:var(--blueprint-light);
  color:var(--slate);
  font-size:12.5px;
  padding:9px 14px;
  border-bottom:1px solid var(--line);
  line-height:1.5;
}
.rank-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.rank-table thead th{
  background:var(--blueprint-light);
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--blueprint);
  padding:9px 6px;
  text-align:center;
  border-bottom:1.5px solid var(--line);
  border-left:1px solid var(--line);
}
.rank-table thead th:first-child{border-left:none; text-align:left; padding-left:12px;}
.rank-table tbody td{
  padding:10px 6px;
  text-align:center;
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}
.rank-table tbody td:first-child{border-left:none;}
.rank-table tbody tr:nth-child(odd){background:#FCFBF8;}
.row-label{
  text-align:left !important;
  padding-left:12px !important;
  display:flex;
  align-items:baseline;
  gap:8px;
}
.row-label .rn{
  font-family:'IBM Plex Mono', monospace;
  font-size:10px;
  color:var(--slate);
  flex-shrink:0;
}
.rank-table input[type=radio]{
  width:17px; height:17px;
  accent-color:var(--blueprint);
  cursor:pointer;
}
@media(max-width:520px){
  .rank-table{font-size:12px;}
  .rank-table thead th{padding:8px 3px;}
  .rank-table tbody td{padding:8px 3px;}
  .row-label{padding-left:8px !important;}
}

.write-q{margin-bottom:16px;}
.write-q .q-text{font-weight:600; font-size:14.5px; margin-bottom:8px;}
.req-asterisk{color:var(--danger);}
tr.row-incomplete .row-label{color:var(--danger); font-weight:600;}
textarea.field-incomplete{border-color:var(--danger); background:#FBEBEA;}
.required-note{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--slate); margin:-8px 0 16px;}

/* team progress */
.team-progress-card{border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px;}
.team-progress-card h4{margin:0 0 4px; font-size:14.5px;}
.progress-bar-track{background:var(--blueprint-light); border-radius:20px; height:8px; overflow:hidden; margin:8px 0 10px;}
.progress-bar-fill{background:var(--blueprint); height:100%; border-radius:20px;}
.progress-bar-fill.complete{background:var(--success);}
.evaluator-row{display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:5px 0; border-top:1px dashed var(--line);}
.evaluator-row:first-of-type{border-top:none;}
.evaluator-row .pending-names{color:var(--slate); font-size:11.5px;}

.progress-note{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  color:var(--slate);
  margin-top:4px;
}
.nav-row{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}
.nav-row .btn{flex:1;}

.done-screen{text-align:center; padding:20px 10px;}
.done-screen .mark{
  width:56px; height:56px; border-radius:50%;
  background:var(--success-bg); color:var(--success);
  display:flex; align-items:center; justify-content:center;
  font-size:26px; margin:0 auto 16px; font-weight:700;
}

.admin-lock{max-width:340px; margin:60px auto;}
.admin-section{margin-bottom:26px;}
.admin-section h3{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.06em;
  font-family:'IBM Plex Mono', monospace;
  color:var(--blueprint);
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
  margin-bottom:12px;
}
.row-flex{display:flex; gap:10px; align-items:center; margin-bottom:8px;}
.row-flex input{flex:1;}
table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
table.data-table th, table.data-table td{
  border:1px solid var(--line); padding:8px 9px; text-align:left; vertical-align:top;
}
table.data-table th{background:var(--blueprint-light); font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase;}
.sub-note{font-size:12.5px; color:var(--slate); line-height:1.5; margin-top:6px;}
.hidden{display:none !important;}
.link-btn{background:none; border:none; color:var(--blueprint); font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer; padding:0; text-decoration:underline;}
.page-credit{
  position:fixed;
  right:16px;
  bottom:12px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--slate);
  background:var(--paper);
  padding:3px 8px;
  border-radius:4px;
  pointer-events:none;
}
@media(max-width:520px){
  .page-credit{ position:static; text-align:right; margin:18px 4px 0; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="eyebrow">MIN E 413: Surface Mining Methods and Operations Management</span>
      <h1>Group Member Evaluation</h1>
    </div>
    <div class="mode-switch">
      <button id="btnModeStudent" class="active">Student</button>
      <button id="btnModeAdmin">Instructor</button>
    </div>
  </header>

  <div id="app"></div>

</div>

<div class="page-credit">Yashar Pourrahimian, PhD, PEng</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============================= CONFIG DEFAULTS ============================= */
// After deploying Code.gs (Google Apps Script) as a web app, paste its "Web app URL" between the quotes.
const API_URL = "https://script.google.com/macros/s/AKfycbwJisLr9Sog2nAQ0uzPoc-Z5Q-8GPGJP2kXHT0RCBLm6Y2puClo1TJn9Lf1gvE8jhFMJQ/exec";

const DEFAULT_QUESTIONS = {
  ranking: [
    {
      title: "Individual and Team Work – Group Teamwork",
      explanation: "Based on your experience working with this teammate, rate each statement.",
      cols: ["1 Rarely","2 Sometimes","3 Usually","4 Consistently"],
      rows: [
        "Completed assigned responsibilities on time",
        "Participated meaningfully in project work",
        "Communicated and coordinated effectively",
        "Was reliable and followed through on commitments",
        "Demonstrated appropriate initiative/leadership",
        "Supported other team members",
        "Handled disagreements constructively",
        "Encouraged respectful and inclusive participation"
      ]
    },
    {
      title: "Ethics and Equity / Accountability and EDI",
      explanation: "Based on your experience working with this teammate, rate each statement.",
      cols: ["1 Rarely","2 Sometimes","3 Usually","4 Consistently"],
      rows: [
        "Took responsibility for assigned work and decisions.",
        "Worked honestly and professionally",
        "Openly identified errors, uncertainty, assumptions, and limitations.",
        "Used data, references, software, code, and AI responsibly",
        "Treated team members respectfully and professionally",
        "Supported fair and inclusive opportunities for participation",
        "Considered different viewpoints and concerns",
        "Supported responsible, evidence-based professional decisions"
      ]
    }
  ],
  writing: [
    "What did this group member do well?",
    "What could this group member improve on?",
    "Describe one specific contribution this member made to the project.",
    "Any additional comments?"
  ]
};

/* ============================= STATE ============================= */
let QUESTIONS = DEFAULT_QUESTIONS;
let session = { studentId:null, student:null, teammates:[] };   // teammates: [{id, name, group, versions, draft, reeval}]
let adminPasscode = null;   // kept in memory only; the real passcode lives inside the Apps Script
let adminData = null;       // { roster, questions, evals, reevals }

const app = document.getElementById('app');

/* ============================= BACKEND (Google Sheet via Apps Script) ============================= */
// All reads/writes go through one web-app URL. Students only ever receive their own records, and
// instructor actions are checked against a passcode that is stored inside the Apps Script, not on this page.
async function api(action, payload){
  if(!API_URL || API_URL.indexOf('PASTE_') !== -1) throw new Error('NOT_CONFIGURED');
  let res;
  try{
    // text/plain keeps this a "simple" request, so the browser doesn't need a CORS preflight.
    res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action, ...(payload || {}) })
    });
  }catch(e){ throw new Error('NETWORK'); }
  let data;
  try{ data = await res.json(); }catch(e){ throw new Error('BAD_RESPONSE'); }
  if(!data || !data.ok) throw new Error((data && data.error) || 'SERVER_ERROR');
  return data;
}

function friendlyError(err){
  const code = String((err && err.message) || '').split(':')[0];
  const map = {
    NOT_CONFIGURED:'This page is not connected to its Google Sheet yet. Add the Web app URL (API_URL) in the script.',
    NETWORK:'Could not reach the server. Check your connection and try again.',
    BAD_RESPONSE:'The server sent an unexpected reply. Please try again in a moment.',
    NOT_FOUND:'That ID was not found on the roster. Check the number and try again.',
    NOT_IN_GROUP:'That person is not in your group.',
    ALREADY_SUBMITTED:'You have already submitted an evaluation for this person. Ask your instructor to approve a re-evaluation.',
    INCOMPLETE:'Please complete every item before submitting.',
    UNAUTHORIZED:'Incorrect passcode.',
    LOCKED:'Too many incorrect attempts. Try again in about 10 minutes.',
    PASSCODE_NOT_SET:'The instructor passcode has not been set in the Apps Script yet.',
    BUSY:'The server is busy right now. Please try again in a few seconds.'
  };
  return map[code] || 'Something went wrong. Please try again.';
}
// For messages like "INVALID_ROSTER: duplicate ID 123" show the part after the colon.
function detailOf(err){
  const m = String((err && err.message) || '');
  const i = m.indexOf(':');
  return i > -1 ? m.slice(i + 1).trim() : friendlyError(err);
}

async function loadSession(id){
  const data = await api('session', { id });
  session.studentId = data.student.id;
  session.student = data.student;
  session.teammates = data.mates;
  QUESTIONS = data.questions || DEFAULT_QUESTIONS;
}

/* ============================= UTIL ============================= */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function flash(el, text, ok){
  el.textContent = text;
  el.style.color = ok ? 'var(--success)' : 'var(--danger)';
  el.classList.remove('hidden');
  setTimeout(()=>el.classList.add('hidden'), ok ? 2500 : 7000);
}
// CSV helpers. csvQuote only adds quotes where needed; csvCell also stops spreadsheet apps from
// treating text that starts with = + - @ as a formula.
function csvQuote(v){
  const s = String(v === null || v === undefined ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvCell(v){
  let s = String(v === null || v === undefined ? '' : v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return csvQuote(s);
}
function parseCsvLine(line, delim){
  const out = []; let cur = '', inQ = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(inQ){
      if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    }else{
      if(ch === '"') inQ = true;
      else if(ch === delim){ out.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur.trim());
  return out;
}

/* ============================= RENDER: STEPPER ============================= */
function stepperHtml(active){
  const steps = ["ID","Group","Evaluate","Done"];
  return `<div class="stepper">${steps.map((s,i)=>{
    let cls = '';
    if(i < active) cls = 'done';
    if(i === active) cls = 'current';
    return `<div class="step ${cls}">${i+1}. ${s}</div>`;
  }).join('')}</div>`;
}

/* ============================= STUDENT FLOW ============================= */
function renderIdEntry(errorMsg){
  app.innerHTML = `
    ${stepperHtml(0)}
    <div class="card">
      <h2>Enter your student ID</h2>
      <p class="sub">We'll pull up your group so you can evaluate each member's contribution to the term project.</p>
      <label class="field-label" for="idInput">Student ID</label>
      <input type="text" id="idInput" class="mono" placeholder="e.g. 1867942" inputmode="numeric" autocomplete="off">
      ${errorMsg ? `<div class="error-msg">${esc(errorMsg)}</div>` : ''}
      <div class="nav-row">
        <button class="btn" id="idSubmitBtn" style="flex:1;">Find my group</button>
      </div>
    </div>
  `;
  const input = document.getElementById('idInput');
  input.focus();
  input.addEventListener('keydown', e => { if(e.key === 'Enter') handleIdSubmit(); });
  document.getElementById('idSubmitBtn').addEventListener('click', handleIdSubmit);
}

async function handleIdSubmit(){
  const val = document.getElementById('idInput').value.trim();
  if(!val){ renderIdEntry("Enter your student ID to continue."); return; }
  const btn = document.getElementById('idSubmitBtn');
  btn.disabled = true; btn.textContent = 'Looking up…';
  try{
    await loadSession(val);
  }catch(err){
    renderIdEntry(friendlyError(err));
    return;
  }
  renderTeamList();
}

async function renderTeamList(){
  app.innerHTML = `${stepperHtml(1)}<div class="card"><p class="sub">Loading your group…</p></div>`;
  try{ await loadSession(session.studentId); }
  catch(err){ renderIdEntry(friendlyError(err)); return; }
  const statuses = session.teammates.map(tm => {
    const versions = tm.versions || [];
    return { tm, versions, submitted: versions.length > 0, draft: tm.draft || null, reeval: tm.reeval || null };
  });

  if(session.teammates.length === 0){
    app.innerHTML = `
      ${stepperHtml(1)}
      <div class="card">
        <h2>${esc(session.student.name)}</h2>
        <p class="sub">${esc(session.student.group)} · <span class="mono">${esc(session.studentId)}</span></p>
        <p class="sub">No other group members are listed under your group. If that looks wrong, check with your instructor.</p>
        <button class="btn secondary" id="switchIdBtn">Use a different ID</button>
      </div>`;
    document.getElementById('switchIdBtn').addEventListener('click', ()=>renderIdEntry());
    return;
  }

  const allDone = statuses.every(s => s.submitted);

  function rowRight(s){
    if(!s.submitted){
      if(s.draft){
        return `<span class="status-chip pending">In progress</span>
          <button class="btn small" data-act="continue" data-tm="${esc(s.tm.id)}">Continue</button>`;
      }
      return `<span class="status-chip pending">Pending</span>
        <button class="btn small" data-act="start" data-tm="${esc(s.tm.id)}">Evaluate</button>`;
    }
    // submitted at least once
    if(s.reeval && s.reeval.status === 'pending'){
      return `<span class="status-chip pending">Approval pending</span>
        <button class="btn small secondary" data-act="review" data-tm="${esc(s.tm.id)}">Review</button>`;
    }
    if(s.reeval && s.reeval.status === 'approved'){
      return `<span class="status-chip done">Re-eval approved</span>
        <button class="btn small secondary" data-act="review" data-tm="${esc(s.tm.id)}">Review</button>
        <button class="btn small" data-act="reevaluate" data-tm="${esc(s.tm.id)}">${s.draft ? 'Continue new evaluation' : 'Submit new evaluation'}</button>`;
    }
    return `<span class="status-chip done">Completed</span>
      <button class="btn small secondary" data-act="review" data-tm="${esc(s.tm.id)}">Review</button>
      <button class="btn small secondary" data-act="request" data-tm="${esc(s.tm.id)}">Request re-evaluation</button>`;
  }

  app.innerHTML = `
    ${stepperHtml(allDone ? 3 : 2)}
    <div class="card">
      <h2>${esc(session.student.name)}</h2>
      <p class="sub">${esc(session.student.group)} · <span class="mono">${esc(session.studentId)}</span> — evaluate each group member below. You can save an evaluation partway through and finish it later.</p>
      <ul class="roster-list">
        ${statuses.map(s => `
          <li>
            <div class="who">
              <span class="name">${esc(s.tm.name)}</span>
              <span class="id">${esc(s.tm.id)}</span>
            </div>

async function renderEvalForm(teammate, opts){

  const draft = opts.draft || null;

  const rankingHtml = QUESTIONS.ranking.map((q, qi) => `

      <div class="grid-title">
        <span>${esc(q.title)}</span>
        <span class="idx">Q${qi+1} · 8 ITEMS</span>
      </div>
      ${q.explanation ? `<div class="grid-explanation">${esc(q.explanation)}</div>` : ''}
      <div style="overflow-x:auto;">
      <table class="rank-table">
        <thead>
          <tr>
            <th>Item</th>
            ${q.cols.map(c => `<th>${esc(c)}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${q.rows.map((row, ri) => `
            <tr>
              <td class="row-label"><span class="rn">R${ri+1}</span><span>${esc(row)}</span></td>
              ${q.cols.map((c, ci) => {
                const checked = draft && draft.ranking && draft.ranking[qi] && draft.ranking[qi][ri] === ci + 1 ? 'checked' : '';
                return `<td><input type="radio" name="rank_${qi}_${ri}" value="${ci + 1}" ${checked}></td>`;
              }).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `).join('');

  const writingHtml = QUESTIONS.writing.map((q, wi) => `
    <div class="write-q">
      <div class="q-text">${wi+1}. ${esc(q)} <span class="req-asterisk">*</span></div>
      <textarea id="write_${wi}">${draft && draft.writing ? esc(draft.writing[wi] || '') : ''}</textarea>
    </div>
  `).join('');

  app.innerHTML = `
    ${stepperHtml(2)}
    <div class="card">
      <h2>Evaluating: ${esc(teammate.name)}</h2>
      <p class="sub"><span class="mono">${esc(teammate.id)}</span> · ${esc(teammate.group)} — evaluator: ${esc(session.student.name)}</p>
      <p class="required-note">Every item below is required to submit — but you can save your progress and finish later.</p>
    </div>
    <form id="evalForm">
      <div class="card">${rankingHtml}</div>
      <div class="card">
        <h2 style="font-size:15px;">Written feedback <span class="req-asterisk">*</span></h2>
        ${writingHtml}
      </div>
      <div class="error-msg hidden" id="formError">Please complete every item before submitting.</div>
      <div class="sub-note hidden" id="draftSaved" style="color:var(--success); margin-top:-6px;">Progress saved — come back anytime to finish.</div>
      <div class="nav-row">
        <button type="button" class="btn secondary" id="backBtn">Back to group</button>
        <button type="button" class="btn secondary" id="saveDraftBtn">Save & finish later</button>
        <button type="submit" class="btn">Submit evaluation</button>
      </div>
    </form>
  `;

  function readForm(){
    const ranking = QUESTIONS.ranking.map((q, qi) => q.rows.map((row, ri) => {
      const sel = document.querySelector(`input[name="rank_${qi}_${ri}"]:checked`);
      return sel ? parseInt(sel.value, 10) : null;
    }));
    const writing = QUESTIONS.writing.map((q, wi) => document.getElementById(`write_${wi}`).value.trim());
    return { ranking, writing };
  }

  document.getElementById('backBtn').addEventListener('click', ()=>renderTeamList());

  document.getElementById('saveDraftBtn').addEventListener('click', async ()=>{
    const { ranking, writing } = readForm();
    const btn = document.getElementById('saveDraftBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    const savedEl = document.getElementById('draftSaved');
    try{
      await api('saveDraft', { evaluatorId: session.studentId, evaluateeId: teammate.id, ranking, writing });
      savedEl.textContent = 'Progress saved — come back anytime to finish.';
      savedEl.style.color = 'var(--success)';
    }catch(err){
      savedEl.textContent = friendlyError(err);
      savedEl.style.color = 'var(--danger)';
    }
    btn.disabled = false; btn.textContent = 'Save & finish later';
    savedEl.classList.remove('hidden');
    setTimeout(()=>{ const el = document.getElementById('draftSaved'); if(el) el.classList.add('hidden'); }, 3500);
  });

  document.getElementById('evalForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errBox = document.getElementById('formError');
    const { ranking, writing } = readForm();

    // clear previous highlights
    document.querySelectorAll('tr.row-incomplete').forEach(tr => tr.classList.remove('row-incomplete'));
    document.querySelectorAll('textarea.field-incomplete').forEach(t => t.classList.remove('field-incomplete'));

    let firstBad = null;
    ranking.forEach((arr, qi) => {
      arr.forEach((v, ri) => {
        if(v === null){
          const cell = document.querySelector(`input[name="rank_${qi}_${ri}"]`);
          const tr = cell ? cell.closest('tr') : null;
          if(tr){ tr.classList.add('row-incomplete'); if(!firstBad) firstBad = tr; }
        }
      });
    });
    writing.forEach((w, wi) => {
      if(!w){
        const ta = document.getElementById(`write_${wi}`);
        ta.classList.add('field-incomplete');
        if(!firstBad) firstBad = ta;
      }
    });

    const incomplete = ranking.some(arr => arr.some(v => v === null)) || writing.some(w => !w);
    if(incomplete){
      errBox.textContent = 'Please complete every item before submitting.';
      errBox.classList.remove('hidden');
      if(firstBad) firstBad.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    errBox.classList.add('hidden');

    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';

    try{
      // The server enforces the rules: one submission per person unless you've approved a re-evaluation,
      // and every earlier version is kept.
      await api('submit', { evaluatorId: session.studentId, evaluateeId: teammate.id, ranking, writing });
    }catch(err){
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit evaluation';
      errBox.textContent = friendlyError(err);
      errBox.classList.remove('hidden');
      return;
    }
    renderTeamList();
  });
}

function rosterToCsv(roster){
  return roster.map(r => [r.id, r.name, r.group].map(csvQuote).join(',')).join('\n');
}
function csvToRoster(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const [id, name, group] = parseCsvLine(line, ',');
    return {id: (id || '').trim(), name: (name || '').trim(), group: (group || '').trim()};
  }).filter(r => r.id && r.name && r.group);
}

// Turns parsed rows-of-cells (from csv/txt/xlsx) into roster objects.
// Detects a header row (ID/Name/Group or Team, in any order) if present; otherwise assumes column order ID, Name, Group.
function rowsToRoster(rows){
  rows = rows.map(r => r.map(c => (c === null || c === undefined) ? '' : String(c).trim())).filter(r => r.some(c => c !== ''));
  if(rows.length === 0) return [];

  let idCol = 0, nameCol = 1, groupCol = 2;
  const headerCandidates = rows[0].map(c => c.toLowerCase());
  const idIdx = headerCandidates.findIndex(c => /^(id|student ?id|id ?number)$/.test(c));
  const nameIdx = headerCandidates.findIndex(c => /^(name|student ?name|full ?name)$/.test(c));
  const groupIdx = headerCandidates.findIndex(c => /^(group|team)$/.test(c));
  const looksLikeHeader = idIdx !== -1 && nameIdx !== -1 && groupIdx !== -1;

  let dataRows = rows;
  if(looksLikeHeader){
    idCol = idIdx; nameCol = nameIdx; groupCol = groupIdx;
    dataRows = rows.slice(1);
  }

  return dataRows.map(r => ({
    id: (r[idCol] || '').trim(),
    name: (r[nameCol] || '').trim(),
    group: (r[groupCol] || '').trim()
  })).filter(r => r.id && r.name && r.group);
}

function parseDelimitedText(text){
  // Auto-detect tab vs comma delimiter from the first non-empty line.
  const firstLine = text.split(/\r?\n/).find(l => l.trim() !== '') || '';
  const delim = firstLine.includes('\t') ? '\t' : ',';
  return text.split(/\r?\n/).map(line => parseCsvLine(line, delim));
}

function parseRosterFile(file){
  return new Promise((resolve, reject) => {
    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    if(ext === 'xlsx' || ext === 'xls'){
      reader.onload = (e) => {
        try{
          const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
          resolve(rowsToRoster(rows));
        }catch(err){ reject(err); }
      };
      reader.readAsArrayBuffer(file);
    }else{
      reader.onload = (e) => {
        try{
          const rows = parseDelimitedText(String(e.target.result));
          resolve(rowsToRoster(rows));
        }catch(err){ reject(err); }
      };
      reader.readAsText(file);
    }
  });
}

function buildTeamProgress(submissions, roster){
  const submittedSet = new Set(submissions.map(s => `${s.evaluatorId}__${s.evaluateeId}`));
  const teams = {};
  roster.forEach(r => { (teams[r.group] = teams[r.group] || []).push(r); });

  return Object.keys(teams).sort().map(teamName => {
    const members = teams[teamName];
    const evaluators = members.map(evaluator => {
      const teammates = members.filter(m => m.id !== evaluator.id);
      const pending = teammates.filter(tm => !submittedSet.has(`${evaluator.id}__${tm.id}`));
      return {
        evaluator,
        total: teammates.length,
        completed: teammates.length - pending.length,
        pendingNames: pending.map(p => p.name)
      };
    });
    const totalExpected = evaluators.reduce((sum, e) => sum + e.total, 0);
    const totalCompleted = evaluators.reduce((sum, e) => sum + e.completed, 0);
    return { teamName, evaluators, totalExpected, totalCompleted };
  });
}

    btn.disabled = true;
    try{
      await api('respondReeval', { passcode: adminPasscode, evaluatorId: r.evaluatorId, evaluateeId: r.evaluateeId, decision });
    }catch(err){ alert(friendlyError(err)); }
    renderAdminPanel(true);
  }
  app.querySelectorAll('button[data-approve]').forEach(btn => btn.addEventListener('click', ()=>respond(btn, parseInt(btn.getAttribute('data-approve'),10), 'approved')));
  app.querySelectorAll('button[data-deny]').forEach(btn => btn.addEventListener('click', ()=>respond(btn, parseInt(btn.getAttribute('data-deny'),10), 'denied')));

  document.getElementById('saveRosterBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('saveRosterBtn');
    const msg = document.getElementById('rosterSaved');
    const text = document.getElementById('rosterBox').value;
    const lineCount = text.split(/\r?\n/).filter(l => l.trim()).length;
    const parsed = csvToRoster(text);
    btn.disabled = true;
    try{
      await api('saveRoster', { passcode: adminPasscode, roster: parsed });
      adminData.roster = parsed;
      const skipped = lineCount - parsed.length;
      flash(msg, `Roster saved (${parsed.length} students)` + (skipped > 0 ? ` — ${skipped} line(s) skipped for missing an ID, name or group.` : '.'), true);
    }catch(err){
      flash(msg, detailOf(err), false);
    }
    btn.disabled = false;
  });

  document.getElementById('rosterFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById('uploadStatus');
    statusEl.classList.remove('hidden');
    statusEl.style.color = 'var(--slate)';
    statusEl.textContent = 'Reading file…';
    try{
      const rows = await parseRosterFile(file);
      if(rows.length === 0){
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = 'No valid rows found. Make sure the file has an ID, Name, and Group column (or those three columns in order).';
        return;
      }
      document.getElementById('rosterBox').value = rosterToCsv(rows);
      statusEl.style.color = 'var(--success)';
      statusEl.textContent = `Parsed ${rows.length} student${rows.length===1?'':'s'} from "${file.name}". Review below, then click Save roster.`;
    }catch(err){
      statusEl.style.color = 'var(--danger)';
      statusEl.textContent = 'Could not read that file. Please upload a .csv, .txt, or .xlsx file with ID, Name, and Group columns.';
    }
    e.target.value = '';
  });

  document.getElementById('saveQBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('saveQBtn');
    const msg = document.getElementById('qSaved');
    const newQ = { ranking: [], writing: [] };
    document.querySelectorAll('.rq-title').forEach((el, i) => {
      newQ.ranking[i] = newQ.ranking[i] || {};
      newQ.ranking[i].title = el.value.trim();
    });
    document.querySelectorAll('.rq-explanation').forEach((el, i) => {
      newQ.ranking[i].explanation = el.value.trim();
    });
    document.querySelectorAll('.rq-cols').forEach((el, i) => {
      newQ.ranking[i].cols = el.value.split(',').map(s=>s.trim()).filter(Boolean);
    });
    document.querySelectorAll('.rq-rows').forEach((el, i) => {
      newQ.ranking[i].rows = el.value.split('\n').map(s=>s.trim()).filter(Boolean);
    });
    newQ.writing = Array.from(document.querySelectorAll('.wq-item')).map(el => el.value.trim()).filter(Boolean);
    btn.disabled = true;
    try{
      await api('saveQuestions', { passcode: adminPasscode, questions: newQ });
      QUESTIONS = newQ; adminData.questions = newQ;
      flash(msg, 'Questions saved.', true);
    }catch(err){
      flash(msg, detailOf(err), false);
    }
    btn.disabled = false;
  });

  app.querySelectorAll('.link-btn[data-idx]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const s = submissions[parseInt(btn.getAttribute('data-idx'),10)];
      renderSubmissionDetail(s);
    });
  });

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn){
    exportBtn.addEventListener('click', ()=>{
      const header = ['Evaluator ID','Evaluator Name','Evaluatee ID','Evaluatee Name','Group','Version','Submitted',
        ...QUESTIONS.ranking.flatMap((q,qi)=>q.rows.map((r,ri)=>`G${qi+1}R${ri+1} – ${r}`)),
        ...QUESTIONS.writing.map((w,wi)=>`W${wi+1} – ${w}`)
      ];
      const lines = [header.map(csvQuote).join(',')];
      submissions.forEach(s=>{
        const row = [s.evaluatorId, s.evaluatorName, s.evaluateeId, s.evaluateeName, s.group, s.version, s.submittedAt].map(csvCell)
          .concat(s.ranking.flat().map(v => v === null || v === undefined ? '' : v))   // ratings are 1-4, matching the column labels
          .concat(s.writing.map(csvCell));
        lines.push(row.join(','));
      });
      const blob = new Blob(['\ufeff' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'peer-evaluations.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }
}

function renderSubmissionDetail(s){
  const detail = document.getElementById('detailView');
  detail.innerHTML = `
    <div class="card">
      <h2 style="font-size:15px;">${esc(s.evaluatorName)} → ${esc(s.evaluateeName)}</h2>
      <p class="sub">${esc(s.group)} · version ${s.version} · submitted ${esc(new Date(s.submittedAt).toLocaleString())}</p>
      ${QUESTIONS.ranking.map((q,qi)=>`
        <div style="margin-bottom:14px;">
          <strong style="font-size:13.5px;">${esc(q.title)}</strong>
          <table class="data-table" style="margin-top:6px;">
            ${q.rows.map((r,ri)=>`<tr><td>${esc(r)}</td><td class="mono">${s.ranking[qi][ri] !== null ? esc(q.cols[s.ranking[qi][ri] - 1]) : '—'}</td></tr>`).join('')}
          </table>
        </div>
      `).join('')}
      ${QUESTIONS.writing.map((w,wi)=>`
        <div style="margin-bottom:10px;">
          <strong style="font-size:13.5px;">${esc(w)}</strong>
          <p class="sub" style="margin-top:4px;">${esc(s.writing[wi])}</p>
        </div>
      `).join('')}
    </div>
  `;
  detail.scrollIntoView({behavior:'smooth'});
}

/* ============================= MODE SWITCH ============================= */
function switchMode(mode){
  document.getElementById('btnModeStudent').classList.toggle('active', mode==='student');
  document.getElementById('btnModeAdmin').classList.toggle('active', mode==='admin');
  if(mode==='student') renderIdEntry();
  else { adminPasscode ? renderAdminPanel(true) : renderAdminLock(); }
}
document.getElementById('btnModeStudent').addEventListener('click', ()=>switchMode('student'));
document.getElementById('btnModeAdmin').addEventListener('click', ()=>switchMode('admin'));

/* ============================= INIT ============================= */
(function init(){
  if(!API_URL || API_URL.indexOf('PASTE_') !== -1){
    app.innerHTML = `<div class="card"><h2>Almost there</h2><p class="sub">This page isn't connected to its Google Sheet yet. Deploy <span class="mono">Code.gs</span> as a web app, then paste the Web app URL into <span class="mono">API_URL</span> near the top of the script in this file.</p></div>`;
    return;
  }
  renderIdEntry();
})();
</script>
